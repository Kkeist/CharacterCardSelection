<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>深度角色问卷</title>
  <link rel="stylesheet" href="styles.css?v=2.6">
  <link rel="icon" type="image/png" href="favicon.png?v=2.6">
  <link rel="apple-touch-icon" href="favicon.png?v=2.6">
</head>
<body>
  <div class="app-container">
    <!-- 主页面 -->
    <main id="main-page" class="page active">
      <header class="header">
        <h1 class="title">深度角色问卷</h1>
      </header>

      <section class="intro-section">
        <div class="intro-card">
          <p class="intro-text">这是一个也许能让你更加深刻探索了解自己，或者深度塑造角色的问卷。<br>你可以在其中抽取问题并回答填写，祝你的深度理解之旅顺利！</p>
          <p class="author-note">✍️ 全文纯手打，但是因为没有人称可能看起来累累的，请见谅；-；。。</p>
        </div>
      </section>

      <!-- 随机抽取全部问题（置于分类之前） -->
      <button class="random-all-btn" id="random-all-btn">
        🎲 随机抽取全部问题
      </button>

      <section class="categories-section">
        <h2 class="section-title">选择问卷分类</h2>
        <div class="categories-grid" id="categories-grid">
          <!-- 11个分类卡片 + 最后一个【完整问卷】卡片将通过JS生成 -->
        </div>
      </section>
    </main>

    <!-- 完整问卷独立页面 -->
    <div id="full-page" class="page">
      <header class="draw-header">
        <button class="back-btn" id="full-back-btn">← 返回</button>
        <h2 class="category-title">📖 完整问卷</h2>
        <button type="button" class="copy-all-top-btn" id="copy-all-btn">
          📋 复制全部
        </button>
      </header>

      <div class="all-questions-content" id="all-questions-content">
        <!-- 动态加载完整问卷格式化内容 -->
      </div>
    </div>

    <!-- 抽卡页面 -->
    <div id="draw-page" class="page">
      <header class="draw-header">
        <button class="back-btn" id="back-btn">← 返回</button>
        <h2 class="category-title" id="category-title">分类名称</h2>
      </header>

      <div class="draw-area">
        <div class="card-container" id="card-container">
          <div class="card" id="card">
            <div class="card-front">
              <span class="card-emoji">🎴</span>
              <span class="card-text">点击抽取</span>
            </div>
            <div class="card-back" id="card-back">
              <div class="card-question-box">
                <p class="question-title" id="question-title">基础问题</p>
              </div>
              <div class="question-hint-box" id="question-hint-box">
                <span class="hint-label">💡 提示 / 思考点</span>
                <p class="hint-text" id="hint-text">提示内容</p>
              </div>
              <div class="card-source" id="card-source"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="action-btn redraw-btn" id="redraw-btn">
          🔄 重新抽取
        </button>
        <button class="action-btn answer-btn" id="answer-btn">
          📋 复制问题
        </button>
      </div>

      <div class="toast" id="toast">已复制到剪贴板</div>
    </div>
  </div>

  <script src="questions.js?v=2.5"></script>
  <script src="app.js?v=2.5"></script>
</body>
</html>
